name: Research dual-track risk budget V2

on:
  workflow_dispatch:
    inputs:
      dca_rmb_per_session:
        description: "Combined long-term DCA RMB each session (INDEX PROXY ONLY)"
        default: "300"
        required: true
      cost_bps:
        description: "Assumed cost per transaction in basis points"
        default: "10"
        required: true

permissions:
  contents: read

jobs:
  risk-budget-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install "pandas>=2.2,<3" "numpy>=1.26,<3" "requests>=2.31,<3" "yfinance>=0.2.50,<2" "exchange_calendars>=4.5,<5"
      - name: Validate V2 source syntax
        run: python -m py_compile research/ndx_dual_track_risk_v2.py research/ndx_dual_track_backtest.py
      - name: Compare F plus risk-budget scenarios
        run: |
          python research/ndx_dual_track_risk_v2.py \
            --dca-rmb-per-session "${{ inputs.dca_rmb_per_session }}" \
            --cost-bps "${{ inputs.cost_bps }}" \
            --output results/dual_track_risk_v2.json
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-track-risk-budget-v2
          path: results/
          if-no-files-found: warn
          retention-days: 30

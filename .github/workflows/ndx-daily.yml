name: Publish daily NDX strategy signal
on:
  workflow_dispatch:
  schedule:
    # 07:35 Beijing time (23:35 UTC), after US regular close year-round.
    - cron: '35 23 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Dependencies
        run: pip install -r requirements.txt
      - name: Calculate signal and build public status
        run: python scripts/build_site.py
      - name: Sync public signal JSON to repository
        shell: bash
        run: |
          set -euo pipefail
          test -s site/signal.json
          python -m json.tool site/signal.json > /dev/null
          cp site/signal.json signal.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signal.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public NDX signal [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Signal JSON unchanged"
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
